<html lang="es">
<head>
  <meta charset="utf-8" />

  <title>Data Lens · Inventario y evaluación</title>
  <style>
    :root{--bg:#f5f7fb;--surface:#fff;--nav:#fff;--line:#e3e8f2;--ink:#16233d;--muted:#61708b;--subtle:#8290a6;--blue:#285bd7;--blue-deep:#2047a7;--blue-light:#edf3ff;--cyan:#0f7995;--green:#137a60;--green-bg:#e8f7f0;--amber:#a56b14;--amber-bg:#fff4e2;--red:#b8424d;--red-bg:#fff0f0;--grey:#e9edf5;--shadow:0 9px 28px rgba(36,54,89,.045);--radius:15px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9cb7ff;outline-offset:2px}button:disabled{opacity:.48;cursor:default}
    .app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);border-right:1px solid var(--line);padding:24px 13px 16px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:4px 13px 24px}.brandmark{height:36px;width:36px;border-radius:11px;background:linear-gradient(145deg,#2144ab,#366de5);display:grid;place-items:center;color:white;font-weight:900;letter-spacing:-2px;box-shadow:0 5px 12px #2a60d729}.brand strong{font-size:17px;letter-spacing:-.55px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.nav-label{padding:12px 14px 9px;color:#93a0b4;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.nav-link{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;border-radius:9px;padding:11px 12px;color:#52637e;font-weight:650;margin:2px 0;transition:background .15s}.nav-link:hover{background:#f4f7fd}.nav-link.active{background:var(--blue-light);color:var(--blue)}.nav-link .ico{width:17px;height:17px;flex-shrink:0}.nav-link .nav-right{margin-left:auto;font-size:9px;color:#7990b9}.side-spacer{flex:1}.side-note{background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 5px 13px}.side-note strong{font-size:11px}.side-note p{color:var(--muted);line-height:1.55;font-size:11px;margin:6px 0 0}.side-cta{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 14px;font-weight:750;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}.side-cta:hover{background:var(--blue-deep)}
    .main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;position:sticky;top:0;z-index:8;backdrop-filter:blur(8px)}.top-left{display:flex;gap:10px;align-items:center;min-width:0}.phase{letter-spacing:1px;font-size:10px;text-transform:uppercase;color:#4e6592;font-weight:800}.top-right{display:flex;align-items:center;gap:9px}.context-pill{display:flex;align-items:center;gap:8px;border:1px solid #dfe5f1;background:#fff;border-radius:9px;padding:9px 11px;font-size:11px;color:#334a72;white-space:nowrap}.context-pill strong{font-weight:750}.context-pill.muted{color:var(--muted)}.demo-tag{border:1px solid #cfdaef;background:#f2f6ff;color:#2f5db8;font-weight:850;text-transform:uppercase;letter-spacing:.55px;font-size:10px;padding:7px 9px;border-radius:7px;white-space:nowrap}.menu-toggle{display:none;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 9px}.content{max-width:1540px;margin:0 auto;padding:28px 34px 80px}.breadcrumbs{display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:#7d8ba1;font-size:12px;margin-bottom:20px}.breadcrumbs button{background:none;border:0;padding:0;color:var(--muted)}.breadcrumbs button:hover{color:var(--blue)}.breadcrumbs span.current{color:var(--ink);font-weight:700}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:1.25px;font-weight:850;color:var(--blue);font-size:10px;margin-bottom:9px}.page-head h1{font-size:29px;letter-spacing:-1.05px;line-height:1.1;margin:0 0 11px;font-weight:800}.page-head p{max-width:780px;color:var(--muted);margin:0;line-height:1.55;font-size:13px}.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border-radius:9px;border:1px solid var(--line);background:#fff;color:#2d4160;font-weight:700;padding:10px 13px;font-size:12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap}.btn:hover{border-color:#bfd0f5;background:#fafdff}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.primary:hover{background:var(--blue-deep)}.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}.btn.small{padding:7px 10px;font-size:11px}.btn .ico{width:14px;height:14px}
    .notice{display:flex;align-items:flex-start;gap:11px;border:1px solid #cddbf3;background:#eff5ff;border-radius:12px;padding:13px 15px;margin-bottom:22px;color:#46648e;font-size:12px;line-height:1.55}.notice strong{color:#2d4e84}.notice .ico{flex-shrink:0;margin-top:1px}.tiny-note{color:var(--subtle);font-size:11px;line-height:1.5}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.stat{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0;box-shadow:var(--shadow)}.stat.clickable{cursor:pointer;transition:box-shadow .16s,border-color .16s,transform .16s}.stat.clickable:hover{border-color:#b4c8fb;box-shadow:0 12px 25px #1e53b912;transform:translateY(-1px)}.stat .st-icon{color:#5070af;background:#f1f5fc;width:33px;height:33px;display:grid;place-items:center;border-radius:9px;float:right}.stat .st-label{font-size:11px;font-weight:700;color:var(--muted);line-height:1.45}.stat .st-value{font-size:30px;line-height:1.25;letter-spacing:-1.2px;font-weight:800;margin:8px 0 5px}.stat .st-detail{color:#79869a;font-size:11px;line-height:1.5}.stat .st-link{color:var(--blue);font-size:10px;font-weight:800;margin-top:12px;display:inline-flex;gap:4px;align-items:center}
    .section{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-width:0}.section + .section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:17px}.section h2{font-size:15px;letter-spacing:-.3px;margin:0 0 6px}.section h3{font-size:13px;margin:0 0 6px}.section-head p,.section p.lead{color:var(--muted);font-size:12px;margin:0;line-height:1.55}.section-cap{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#8b99af;margin-bottom:12px}.separator{border:0;border-top:1px solid var(--line);margin:22px 0}.route-card{border:1px solid var(--line);border-radius:13px;padding:19px;display:flex;flex-direction:column;gap:13px;background:#fff;min-width:0;transition:border-color .15s,transform .15s;cursor:pointer}.route-card:hover{border-color:#b6c9f4;transform:translateY(-1px)}.route-head{display:flex;align-items:center;justify-content:space-between}.route-icon{height:40px;width:40px;border-radius:11px;background:#edf3ff;display:grid;place-items:center;color:var(--blue)}.route-icon .ico{height:21px;width:21px}.route-card h3{font-size:16px;margin:0}.route-card p{color:var(--muted);font-size:12px;line-height:1.5;margin:5px 0 0}.route-numbers{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px;border-radius:10px;background:#f7f9fd}.route-numbers strong{font-size:20px;letter-spacing:-.5px}.route-numbers span{font-size:10px;display:block;color:var(--muted);margin-top:4px}.route-footer{border-top:1px solid var(--line);padding-top:12px;color:var(--blue);font-weight:800;font-size:11px;display:flex;justify-content:space-between;align-items:center;margin-top:auto}
    .badge{font-size:10px;line-height:1.3;font-weight:800;display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:5px 7px;white-space:nowrap;background:#f1f4f9;color:#61708a}.badge.green{background:var(--green-bg);color:var(--green)}.badge.red{background:var(--red-bg);color:var(--red)}.badge.amber{background:var(--amber-bg);color:var(--amber)}.badge.blue{background:var(--blue-light);color:var(--blue)}.badge.purple{background:#f1efff;color:#6a56b8}.badge.outline{background:#fff;border:1px solid var(--line)}
    .table-tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:13px;align-items:center}.search{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;color:#7b89a1;padding:0 10px;gap:9px;min-width:190px}.search input{min-width:0;width:100%;border:0;background:transparent;outline:none;padding:10px 0;color:var(--ink);font-size:12px}.search:focus-within{border-color:#9cb7ff;box-shadow:0 0 0 3px #285bd711}.search .ico{width:15px;height:15px}.tool-group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;border-radius:7px;color:#667792;padding:8px 10px;font-size:11px;font-weight:750}.filter.active{color:var(--blue);border-color:#b9caf2;background:var(--blue-light)}.table-wrap{overflow-x:auto;max-width:100%}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{padding:12px 11px;background:#f8fafd;color:#71809a;font-size:10px;text-transform:uppercase;letter-spacing:.55px;white-space:nowrap;font-weight:850;border-bottom:1px solid var(--line)}td{padding:14px 11px;border-bottom:1px solid #edf0f5;color:#41516e;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tr.selectable{cursor:pointer}tr.selectable:hover{background:#f8faff}.link-text{color:#244d9c;font-weight:800}.subline{display:block;color:#90a0b4;font-size:10px;font-weight:500;margin-top:5px}.strong{font-weight:780;color:#263752}.muted{color:var(--muted)}.right{text-align:right}.mid{text-align:center}.no-rows{padding:32px;text-align:center;color:var(--muted)}.coverage{display:flex;align-items:center;gap:9px}.coverage .bar{flex:1;min-width:54px;height:7px;border-radius:99px;background:#ecf0f6;overflow:hidden}.bar-fill{height:100%;background:var(--blue);border-radius:99px}.bar-fill.success{background:#1b9b78}.bar-fill.warn{background:#ecab36}.coverage .value{font-size:10px;color:#687893;min-width:41px;text-align:right}.callout{background:#f8fafd;border:1px solid var(--line);padding:14px 16px;border-radius:11px;font-size:12px;line-height:1.6;color:#64748f}.callout strong{color:#344967}.mini-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f5;gap:12px}.mini-row:last-child{border-bottom:0}.mini-row-title{font-weight:750;font-size:12px;color:#35445e}.mini-row-sub{font-size:11px;color:#90a0b4;margin-top:4px}.minibar{height:8px;border-radius:99px;background:#edf0f6;overflow:hidden}.minibar div{height:100%;background:#4572dc;border-radius:99px}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:10px;color:#7d89a0}.legend span:before{content:"";display:inline-block;height:8px;width:8px;background:#416fdb;border-radius:2px;margin-right:6px}.legend .okay:before{background:#329e82}.legend .missing:before{background:#dbe2ed}.legend .problem:before{background:#df7a78}.segbar{display:flex;height:11px;background:#edf1f7;border-radius:99px;overflow:hidden}.segbar span{height:100%}.segbar .ok{background:#3aa58a}.segbar .problem{background:#df787d}.segbar .missing{background:#e5eaf2}.dim{color:var(--subtle)}
    .tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 1px 12px;color:#7e8ca1;font-size:12px;font-weight:750;white-space:nowrap}.tabs button.active{border-color:var(--blue);color:var(--blue)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.fact{border:1px solid var(--line);border-radius:10px;padding:13px}.fact .key{font-size:10px;color:#7b89a2}.fact .val{font-size:13px;margin-top:8px;font-weight:750;overflow-wrap:anywhere}.finding{display:flex;gap:13px;padding:13px;border:1px solid #f1d9d8;border-radius:11px;background:#fffbfb;margin-top:10px}.finding .f-icon{height:31px;width:31px;border-radius:8px;background:#fff0f0;color:#b64754;display:grid;place-items:center;flex-shrink:0}.finding h4{font-size:12px;margin:0 0 4px}.finding p{font-size:11px;color:#7d7480;margin:0;line-height:1.55}.finding button{margin-left:auto;flex-shrink:0}.rulebar{height:13px;display:flex;background:#eef1f6;overflow:hidden;border-radius:20px;margin:12px 0}.rulebar .good{background:#319f83}.rulebar .bad{background:#df7479}.kpi-tag{font-size:10px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.detail-card{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px}.detail-card h3{margin:0 0 6px}.detail-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.metric-val{font-size:25px;font-weight:800;letter-spacing:-.8px}.empty-box{padding:30px;text-align:center;border:1px dashed #c9d4e6;border-radius:12px;background:#fafcff;color:#65748d;font-size:12px}.empty-box strong{display:block;color:#374965;font-size:13px;margin-bottom:6px}.inline-action{border:none;background:none;padding:0;color:var(--blue);font-size:11px;font-weight:750}.inline-action:hover{text-decoration:underline}.footer-note{margin-top:24px;font-size:11px;color:#8491a5;line-height:1.6}
    .modal-bg,.drawer-bg{position:fixed;inset:0;background:rgba(19,34,58,.38);z-index:30;display:none}.modal-bg.open,.drawer-bg.open{display:flex}.modal-bg{align-items:center;justify-content:center;padding:18px}.modal{width:min(540px,100%);padding:26px;background:white;border-radius:17px;box-shadow:0 30px 80px #101b3035}.modal h2{font-size:21px;letter-spacing:-.4px;margin:6px 0 10px}.modal p{font-size:12px;line-height:1.7;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;margin-top:24px}.drawer-bg{justify-content:flex-end}.drawer{height:100%;width:min(490px,100%);background:#fff;box-shadow:-17px 0 45px #10234022;padding:26px;overflow:auto}.drawer-top{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.drawer-top h2{font-size:20px;letter-spacing:-.5px;margin:6px 0 0}.close-x{background:#f2f5fa;border:0;border-radius:8px;padding:8px;color:#5a6980;display:grid;place-items:center}.drawer .field{padding:13px 0;border-bottom:1px solid #edf0f5}.drawer .field .key{color:#8491a5;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}.drawer .field .val{font-size:13px;color:#2e3f5b;margin-top:7px;line-height:1.65;overflow-wrap:anywhere}.drawer p{color:var(--muted);line-height:1.6;font-size:12px}.project-stamp{padding:11px 13px;border:1px solid #d9e4f4;border-radius:10px;display:inline-flex;gap:10px;align-items:center;background:#f8fbff;font-size:11px;color:#546b8c}.project-stamp strong{color:#2b4d88}.top-mobile{display:none}
    @media(max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.topbar{padding:0 22px}.content{padding:26px 24px 70px}.context-pill.muted{display:none}}
    @media(max-width:820px){.app{display:block}.sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);width:245px;box-shadow:14px 0 28px #1f2d4a18;transition:transform .2s}.sidebar.open{transform:translateX(0)}.menu-toggle{display:inline-flex}.topbar{height:64px}.phase{font-size:9px}.context-pill{display:none}.demo-tag{font-size:9px}.content{padding:22px 16px 60px}.page-head{flex-direction:column}.head-actions{justify-content:flex-start}.g3,.g2{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:1fr 1fr}.top-mobile{display:block}}
    @media(max-width:480px){.g4,.g5{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat .st-value{font-size:23px}.section{padding:16px}.route-numbers strong{font-size:17px}.page-head h1{font-size:25px}.facts{grid-template-columns:1fr}.topbar{padding:0 12px}}

    /* Visualizaciones circulares de cobertura y estados — v0.2 */
    .donut-layout{display:flex;align-items:center;justify-content:center;gap:24px;min-height:203px;flex-wrap:wrap}
    .donut-chart{width:184px;height:184px;flex:0 0 184px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #e3e9f4;position:relative}
    .donut-core{width:130px;height:130px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 1px #e8ecf4}
    .donut-core strong{font-size:29px;letter-spacing:-1.1px;color:#162b4c;line-height:1.2}
    .donut-core span{color:#78879e;font-size:10px;max-width:98px;line-height:1.45;margin-top:3px}
    .donut-legend{display:flex;flex-direction:column;gap:13px;flex:1;min-width:184px;max-width:340px}
    .donut-legend-row{display:flex;align-items:center;gap:9px;font-size:12px;color:#4b5972}
    .donut-dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
    .donut-legend-label{flex:1;line-height:1.35}
    .donut-legend-val{font-weight:800;color:#263858;white-space:nowrap}
    .donut-legend-val small{font-size:10px;color:#8c9ab0;font-weight:500;margin-left:5px}
    .source-label{display:inline-flex;align-items:center;gap:5px;border:1px solid #dce5f5;background:#f8fbff;border-radius:7px;padding:4px 8px;font-size:10px;color:#415b86;font-weight:700}
    .source-label.s3{background:#f2f7ff;border-color:#d9e5fc;color:#2458a2}
    .source-label.redshift{background:#f5f2ff;border-color:#e5dcfa;color:#6b4b9f}
    .context-explain{margin-top:13px;color:#78869b;font-size:11px;line-height:1.55}
    @media(max-width:530px){.donut-chart{width:164px;height:164px;flex-basis:164px}.donut-core{width:116px;height:116px}.donut-core strong{font-size:25px}.donut-legend{min-width:100%}.donut-layout{gap:18px}}

    /* Fase 2: S3 / conexión / flujo de evaluación. Respeta las proporciones y tipografía de v0.2 */
    .stepper{display:flex;align-items:center;gap:7px;margin:2px 0 8px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:thin}
    .step{display:flex;flex:0 0 auto;align-items:center;gap:7px;font-size:11px;font-weight:750;color:#8794aa;padding:9px 11px;background:#f7f9fd;border:1px solid var(--line);border-radius:9px;white-space:nowrap}
    button.step{font-family:inherit;cursor:pointer;transition:background .16s,border-color .16s}
    button.step:hover{background:#edf3ff;border-color:#8daef2;color:#214eaa}
    button.step:focus-visible{outline:3px solid #9db7fb;outline-offset:2px}
    .step.active{color:#2b5cc9;background:#edf3ff;border-color:#bfd2f8}.step.done{color:#137a60;background:#e8f7f0;border-color:#c6e5d7}
    .step-num{display:grid;place-items:center;border-radius:50%;width:20px;height:20px;background:#e5ebf6;font-size:10px;flex:0 0 20px}
    .step.active .step-num{background:#285bd7;color:#fff}.step.done .step-num{background:#d1eddf;color:#146c57}
    .step-disabled{opacity:.65;cursor:default}
    .step-hint{font-size:11px;line-height:1.5;color:#72819a;margin:0 0 17px}
    .scan-bulk-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 15px;margin:15px 0 17px;background:#f5f8ff;border:1px solid #d9e5fb;border-radius:11px}
    .scan-bulk-actions .bulk-desc{flex:1 1 255px;min-width:180px}
    .scan-bulk-actions strong{font-size:12px;color:#253e70;display:block}
    .scan-bulk-actions p{font-size:11px;line-height:1.5;color:#6b7c97;margin:4px 0 0}
    .scan-bulk-actions .bulk-controls{display:flex;flex-wrap:wrap;gap:8px}
    .scan-bulk-actions .btn{white-space:nowrap}
    .scan-category-status{margin-top:10px;font-size:11px;color:#61728e;line-height:1.4}
    @media(max-width:600px){.scan-bulk-actions .bulk-controls{width:100%}.scan-bulk-actions .bulk-controls .btn{flex:1}.stepper{margin-right:-4px}}
    .wizard-panel{background:white;border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:var(--shadow)}
    .wizard-panel h2{font-size:17px;letter-spacing:-.4px;margin:0 0 6px}.wizard-panel p{color:var(--muted);font-size:12px;line-height:1.6}
    /* Fase 3 v0.8: un único control para avanzar, junto al progreso, siempre visible.
       El encabezado principal permanece intacto y la banda se pega inmediatamente debajo. */

    .progressline{height:9px;background:#eaf0f9;border-radius:9px;overflow:hidden}.progressline span{display:block;height:100%;background:#3366d7;border-radius:9px}

    /* Fase 3: conexiones + asistente de escaneo; la visualización aprobada de Datos/S3 no se modifica */
    .wf-caption{font-size:11px;color:#8190a7;line-height:1.5}

    /* Fase 2 revisión S3 v0.4: reducir cajas anidadas en detalle del bucket */

    /* Fase 4 v1.1: Diagnóstico central y linaje interactivo. Capas añadidas sin rediseñar pantallas aprobadas. */
    .diag-jump{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#f8faff;border:1px solid #d5e0f8;border-left:4px solid #3768d9;border-radius:12px;padding:17px 20px;margin-bottom:18px}

    .lineage-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}.lineage-tool{width:32px;height:32px;border:1px solid #d8e3f2;border-radius:8px;background:#fff;font-weight:800;font-size:16px;color:#36527b}

.diag-jump,.g13-overview-entry{border:1px solid #dbe6f5!important;border-radius:var(--dl-r-lg)!important;box-shadow:var(--dl-border-shadow);margin-bottom:13px;background:linear-gradient(110deg,#f7faff,#ffffff 60%)!important}
.diag-jump{border-left:3px solid var(--dl-issue)!important}

.table-wrap{overflow:auto;max-width:100%}
.table-wrap table{border-collapse:separate;border-spacing:0;font-size:11.5px}

.table-wrap tr:hover td{background:#f7faff!important}

.badge{border-radius:var(--dl-r-pill)!important;font-size:10px;font-weight:740;white-space:nowrap}

.g13-shell .dl-kind-s3,.g13-shell .dl-kind-bucket,.g13-shell .dl-kind-prefix{background:var(--dl-s3-bg);color:var(--dl-s3);border-color:#f4e0bf}

.g13-shell .dl-kind-table{background:var(--dl-table-bg);color:var(--dl-table);border-color:#d7edf3}
.g13-shell .dl-kind-job{background:var(--dl-job-bg);color:var(--dl-job);border-color:#e7dafb}
.g13-shell .dl-kind-label{font-size:10px;text-transform:uppercase;letter-spacing:.075em;color:#8c98ab;font-weight:730}

.g13-shell .dl-inspector-name h3{margin:4px 0;font-size:20px;letter-spacing:-.025em;line-height:1.27;color:#1b2b49}

.g13-shell .dl-descendant-warning{font-size:10px;color:#a36419;background:#fff7e8;border:1px solid #f2e0bb;border-radius:999px;padding:5px 8px}
.g13-shell .dl-inspector-description{font-size:12px;color:#63738a;line-height:1.55;margin:9px 0 17px}
.g13-shell .dl-inspector-section-title{font-size:10px;color:#8091a7;font-weight:770;letter-spacing:.055em;text-transform:uppercase;margin:18px 0 9px}

.g13-shell .dl-inspector-metrics>div{border:1px solid #e5ebf3;border-radius:13px;padding:12px 11px;display:flex;flex-direction:column;gap:4px;background:#f9fbfe}

.g13-shell .dl-inspector-kv{font-size:11px!important}

.g13-shell .dl-inspector-kv td:last-child{color:#273e60;font-weight:620;overflow-wrap:anywhere}
.g13-shell .dl-inspector-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:22px}
.g13-shell .dl-inspector-actions .btn{font-size:11px;display:inline-flex;align-items:center;gap:8px}
.g13-shell .dl-inspector-pager{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:9px;color:#8290a4;font-size:10px}

.g13-shell .g12-inspect{min-height:0}
.g13-shell .g12-inspect .g12-actionline{display:none}
.g13-shell .g16-inspector-tab{background:#f6f9ff!important;border:1px solid #d3e1f3!important;color:#4d6e9e!important;box-shadow:0 4px 9px rgba(40,70,120,.06)!important}
/* cloud-console density but Data Lens typography and color */
@media(max-width:760px){
 .dl-page-mark{width:38px;height:38px;border-radius:12px}
 .dl-page-head h1{font-size:22px}
 .dl-page-heading{gap:10px}

 .stat.dl-stat{min-height:116px}

}

/* v2.0 final polish — reduce editorial text density */
.project-stamp{display:none!important}
.g13-map-help{display:none!important}
@media (max-width:700px){
 .diag-jump,.g13-overview-entry{display:flex!important;flex-wrap:wrap!important;gap:12px!important;padding:18px!important}
 .diag-jump>div,.g13-overview-entry>div:nth-child(2){flex:0 1 auto!important;min-height:0!important;height:auto!important}
 .diag-jump .btn,.g13-overview-entry .btn{flex:0 0 auto!important}
 .g13-overview-entry .g13-overview-symbol{flex:0 0 42px!important}
}

/* ================================================================
   Data Lens 2.1 - inventory & resource details visual system
   Technical console approach: density, wayfinding, meaningful tabs.
   ================================================================ */
:root { --dl21-ink:#172b45;--dl21-muted:#64748b;--dl21-border:#dfe6f0;--dl21-bg:#f6f8fb;--dl21-white:#fff;--dl21-blue:#2563c6;--dl21-s3:#ad6c13;--dl21-issue:#bd3549;--dl21-green:#137e67 }
.content{padding-top:18px!important}
.page-head.dl-page-head{margin-bottom:18px!important}
.dl-page-head .eyebrow{font-size:10px!important}
.dl-page-head h1{font-size:27px!important}
.dl-page-head p{font-size:12px!important}
.section{border-color:var(--dl21-border);box-shadow:0 1px 3px rgba(16,40,72,.025);border-radius:12px}
.section-head{padding:16px 19px!important}
.section-head h2{font-size:15px!important;font-weight:745!important}
.section-head p{font-size:11px!important;max-width:630px}
.table-wrap{overflow-x:auto!important}
.table-wrap table{width:100%;border-collapse:separate!important;border-spacing:0!important;font-size:12.5px!important;line-height:1.42!important}
.table-wrap th{position:relative;background:#f4f7fa!important;color:#435974!important;font-size:11.7px!important;text-align:left!important;font-weight:720!important;letter-spacing:0!important;padding:12px 15px!important;height:auto!important;border-bottom:1px solid #d8e0eb!important;text-transform:none!important}
.table-wrap td{background:#fff;padding:12px 15px!important;color:#273d59!important;border-bottom:1px solid #eaf0f5!important;font-size:12.5px!important;line-height:1.45!important}
.table-wrap tbody tr:nth-child(even) td{background:#fbfcfe}
.table-wrap tbody tr:hover td{background:#edf5ff!important}
.table-wrap tbody tr:last-child td{border-bottom:0!important}
.table-wrap .link-text{color:#2167bd!important;font-weight:735!important;text-decoration:none}
.table-wrap .link-text:hover{text-decoration:underline}
.table-wrap .subline{font-size:10.5px!important;color:#7c8999!important;margin-top:3px}
.table-wrap .s3-source,.table-wrap .dim{font-size:11px;color:#77869a}
.table-wrap .right{width:36px;white-space:nowrap;color:#7794b0}
.table-wrap td .badge{font-size:10.5px!important;letter-spacing:0;font-weight:650;border-radius:999px!important}
.table-tools{padding:13px 17px 11px!important;margin-bottom:0!important;gap:9px!important;align-items:center}
.table-tools .search{min-height:34px;border:1px solid #d5e0ec!important;background:#fff!important;box-shadow:0 1px 2px rgba(20,44,74,.03);max-width:340px}
.table-tools input{font-size:12px!important}
.tool-group{gap:7px!important}
.tool-group button.filter{min-height:30px!important;padding:6px 12px!important;background:#fff;border-color:#dbe4ef!important;color:#566f8e}
.tool-group button.filter.active{color:#1956ab!important;background:#e8f0fe!important;border-color:#b9d0f7!important}
.dl21-state-filters{padding:5px 17px 11px!important;margin:0!important;border-bottom:1px solid #e9eef6}
/* All clickable inventory rows use the same compact, technical language. */
.dl21-entity{display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.dl21-entity svg{color:#5f8ab9;flex-shrink:0}
.dl21-numeric{font-variant-numeric:tabular-nums;font-weight:650}
/* Make inventory the primary material, analytics secondary. */
.content:has(#table-search) .grid.g4:not(.dl21-summary-kpis){gap:12px!important;margin-top:16px!important}
.content:has(#table-search) .stat.dl-stat{min-height:110px;padding:15px!important}
.content:has(#table-search) .st-icon{width:28px!important;height:28px!important}
.content:has(#table-search) .st-value{font-size:24px!important}
.content:has(#table-search) .grid.g2 .donut{transform:scale(.78);transform-origin:left center}
.content:has(#table-search) .section:has(.donut){min-height:0!important}
/* AWS-inspired resource details: static identity, segmented summary, task tabs. */
.dl21-asset-overline{display:flex;gap:9px;align-items:center;margin:-5px 0 14px;flex-wrap:wrap}
.dl21-kind{display:inline-flex;align-items:center;gap:6px;font-size:11.4px;font-weight:725;border-radius:999px;padding:6px 10px;background:#eaf2fb;color:#315b9a;border:1px solid #d4e4f6}
.dl21-kind-s3{color:var(--dl21-s3);background:#fff5e7;border-color:#f3dbba}
.dl21-kind-redshift{color:#355db7;background:#eff3ff;border-color:#d2ddfc}
.dl21-kind-table{color:#147f91;background:#ebf9fb;border-color:#c9e9ef}
.dl21-status{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.3px;font-weight:720;border:1px solid transparent;line-height:1.3;white-space:nowrap}
.dl21-status.bad{color:#b93145;background:#fff1f3;border-color:#f3cdd2}
.dl21-status.good{color:#138066;background:#ebf8f1;border-color:#c8eadb}
.dl21-status.pending{color:#a87520;background:#fff9eb;border-color:#f7e7bd}
.dl21-status.idle{color:#687d96;background:#f3f6fa;border-color:#e0e5ef}
.dl21-resource-bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0 0 18px;background:#fff;border:1px solid #dce5ef;border-radius:11px;overflow:hidden;box-shadow:0 1px 2px rgba(13,36,69,.02)}
.dl21-resource-bar>div{min-width:0;padding:14px 18px;position:relative}
.dl21-resource-bar>div+div:before{content:'';position:absolute;left:0;top:18px;bottom:18px;width:1px;background:#e7edf5}
.dl21-resource-bar dt{font-size:10.6px!important;line-height:1.4;color:#6d7c8e;font-weight:660;letter-spacing:.01em}
.dl21-resource-bar dd{margin:5px 0 0;color:#203850;font-weight:750;font-size:13.8px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.dl21-asset-section{padding:0!important;overflow:hidden!important}
.dl21-asset-section .dl21-tabs{display:flex!important;gap:1px!important;padding:1px 17px 0!important;background:#fbfcfe!important;border-bottom:1px solid #dce4ee!important;overflow-x:auto;white-space:nowrap;min-height:54px;align-items:stretch}
.dl21-tabs button{height:52px!important;min-height:0!important;font-size:12.5px!important;flex:none!important;border:0!important;border-radius:0!important;color:#667b94!important;background:transparent!important;padding:11px 17px!important;font-weight:660!important;position:relative}
.dl21-tabs button:hover{color:#265da9!important;background:#f0f5fc!important}
.dl21-tabs button.active{color:#235fb7!important;background:transparent!important;font-weight:760!important}
.dl21-tabs button.active:after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:3px;border-radius:3px 3px 0 0;background:#2870d9}
.dl21-tab-body{padding:17px 19px 21px;min-height:260px}
.dl21-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;margin-bottom:15px}
.dl21-detail-panel{border:1px solid #e0e7ef;border-radius:10px;background:#fff;overflow:hidden;min-width:0;margin-bottom:13px}
.dl21-detail-grid .dl21-detail-panel{margin-bottom:0}
.dl21-detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:47px;padding:11px 15px;border-bottom:1px solid #e9eef5;background:#fafcff}
.dl21-detail-head h3{font-size:13px;font-weight:760!important;margin:0;letter-spacing:-.006em;color:#213958}
.dl21-property-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0!important;padding:4px 14px 11px}
.dl21-property{padding:12px 6px 11px;min-width:0;border-bottom:1px solid #eff2f6}
.dl21-property:nth-last-child(-n+2){border-bottom:0}
.dl21-property dt{color:#6e8094;font-size:10.8px;font-weight:665;margin-bottom:5px}
.dl21-property dd{font-size:12.6px;color:#233d59;font-weight:630;margin:0!important;overflow-wrap:anywhere;line-height:1.5}
.dl21-property small{display:block;margin-top:5px;color:#98a4b2;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl21-assessment-head{padding:14px 15px 1px}
.dl21-eval-counts{display:flex;align-items:center;gap:0;padding:14px 10px 14px}
.dl21-eval-counts>div{flex:1;min-width:0;padding:0 12px}
.dl21-eval-counts>div+div{border-left:1px solid #e6edf4}
.dl21-eval-counts strong{display:block;color:#1d344e;font-size:23px;font-weight:760;line-height:1.2;font-variant-numeric:tabular-nums}
.dl21-eval-counts span{display:block;color:#77879b;font-size:10.5px;margin-top:5px;line-height:1.45}
.dl21-inline-link{display:inline-flex;align-items:center;gap:5px;font-size:11.3px!important;font-weight:730!important;color:#2464b5!important;background:transparent!important;border:0!important;white-space:nowrap;padding:6px 7px!important;border-radius:7px!important;cursor:pointer}
.dl21-inline-link:hover{background:#ecf3fe!important;text-decoration:underline}
.dl21-explain{font-size:10.7px;color:#8694a4;margin:0 15px 15px;line-height:1.5}
.dl21-detail-panel>.table-wrap{margin:0!important}
.dl21-detail-panel .table-wrap table{font-size:12px!important}
.dl21-detail-panel .table-wrap th{font-size:11px!important}
.dl21-detail-panel .table-wrap td{font-size:12px!important}
.dl21-path{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#426caa;font-size:11px}
.dl21-quality-total{display:flex;gap:12px;align-items:center;padding:15px 15px 0}

.dl21-quality-total span{font-size:11px;color:#64768c}
.dl21-detail-panel .rulebar{margin:10px 15px}

.dl21-finding-item{display:grid;grid-template-columns:minmax(86px,auto) minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px 14px;border-bottom:1px solid #edf1f6}

.dl21-finding-item strong{font-size:12.7px;color:#223851;display:block}

.dl21-empty-inline{padding:22px 16px;font-size:12px;color:#71869f}
.dl21-inline-row{display:flex;gap:12px;align-items:center;padding:16px}
.dl21-asset-section .s3-detail-group{margin:0 0 14px!important}
.dl21-asset-section .s3-detail-group:last-child{margin-bottom:0!important}
.dl21-asset-section .s3-detail-heading{padding:14px 15px!important}
.dl21-asset-section .s3-detail-heading h3{font-size:13px!important}
.dl21-asset-section .s3-detail-heading p{font-size:11px!important}

.dl21-diag-entry{background:#fff;padding:22px 23px}
.dl21-diag-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fff1f3;color:#bf3e4d;float:right}

.sidebar,.nav-item,.content,.topbar{font-family:"Open Sans","Helvetica Neue",Helvetica,Arial,sans-serif!important}
h1,h2,h3,h4{letter-spacing:-.024em!important;font-weight:700!important}
.dl24-evaluation{background:transparent;border:0;box-shadow:none;overflow:visible}
.dl24-evaluation .dl22-eval-header{padding:9px 1px 18px;align-items:center}
.dl24-evaluation .dl22-eval-header h2{font-size:19px;color:#172d45;font-weight:700;letter-spacing:-.035em;margin:0 0 4px}
.dl24-evaluation .dl22-eval-header p{font-size:12px;color:#71849b;margin:0}
.dl24-evaluation .dl23-critical-overview{background:#fff1f3;color:#ad2d44;border:1px solid #efb7c4;border-radius:999px;font-size:11px;padding:7px 11px}
.dl24-pillar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.dl24-pillar{--p:#6855b6;--p-soft:#f5f2ff;--p-line:#ded4f7;--p-deep:#48328e;position:relative;border-radius:17px;overflow:hidden;border:1px solid var(--p-line);background:linear-gradient(165deg,var(--p-soft) 0%,#fff 46%,#fff 100%);box-shadow:0 2px 5px #1f334609,0 6px 20px #263e5308;transition:box-shadow .16s,transform .16s,border-color .16s;isolation:isolate}
.dl24-pillar::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:4px;background:var(--p);pointer-events:none}
.dl24-pillar:hover{box-shadow:0 9px 26px #29425b18;transform:translateY(-1px)}
.dl24-pillar[open]{border-color:var(--p);box-shadow:0 7px 22px #293d5a13}
.dl24-tone-responsability{--p:#715bc4;--p-soft:#f0ecff;--p-line:#d8cff8;--p-deep:#4d3a9b}
.dl24-tone-visibility{--p:#2283c0;--p-soft:#eaf6fe;--p-line:#c9e5f8;--p-deep:#125e96}
.dl24-tone-quality{--p:#079785;--p-soft:#e6f8f3;--p-line:#b9ebdf;--p-deep:#076e64}
.dl24-tone-security{--p:#326bd1;--p-soft:#eaf1ff;--p-line:#c5d8fa;--p-deep:#234d9e}
.dl24-tone-privacy{--p:#a34f9a;--p-soft:#faedfa;--p-line:#efcced;--p-deep:#813078}
.dl24-pillar>summary{list-style:none;padding:19px 19px 16px;cursor:pointer;display:block;position:relative;min-height:243px;outline-offset:-3px}
.dl24-pillar>summary::-webkit-details-marker{display:none}
.dl24-pillar>summary:focus-visible{outline:3px solid var(--p);border-radius:16px}
.dl24-card-header{display:flex;align-items:center;gap:11px;min-height:45px}
.dl24-pillar-icon{flex:none;width:40px;height:40px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--p) 18%,transparent)}
.dl24-card-title{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.dl24-card-title>strong{color:#24374d;font-size:14px;font-weight:700;line-height:1.3}
.dl24-card-title>small{color:#70829a;font-size:12px;line-height:1.38}
.dl24-expand{display:grid;place-items:center;color:#7d8fa6;flex:none;width:22px;height:22px;border-radius:50%;background:#ffffffc7;border:1px solid #dce4ee;align-self:flex-start}
.dl24-expand svg{transition:transform .18s}.dl24-pillar[open] .dl24-expand svg{transform:rotate(180deg)}
.dl24-card-measure{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px}
.dl24-primary{min-width:0}.dl24-eyebrow{display:block;font-size:10.5px;letter-spacing:.065em;font-weight:700;color:#556b83;line-height:1.25;white-space:nowrap}
.dl24-primary-number{color:var(--p-deep);font-size:39px;font-weight:700;line-height:1.08;letter-spacing:-.06em;font-variant-numeric:tabular-nums;padding-top:4px}
.dl24-coverage{display:flex;flex-direction:column;align-items:flex-end;border-left:1px solid var(--p-line);padding-left:15px;gap:1px;min-width:105px;text-align:right}
.dl24-coverage>span{color:#5c7088;font-weight:700;letter-spacing:.06em;font-size:10px}
.dl24-coverage>strong{color:#243a53;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.dl24-coverage>small{font-size:10.5px;color:#8293a4;line-height:1.4;max-width:116px}
.dl24-meter{height:9px;border-radius:999px;background:#e4eaf1;overflow:hidden;margin-top:14px;position:relative}
.dl24-meter>span{display:block;height:100%;background:var(--p);border-radius:99px;transition:width .3s}
.dl24-measure-caption{margin:6px 0 0;font-size:11.5px;color:#6b7f93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl24-card-footer{min-height:35px;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:13px}
.dl24-chip{display:inline-flex;align-items:center;gap:4px;min-height:23px;border:1px solid #e6edf3;color:#62768c;background:#f4f7fb;border-radius:99px;font-size:11px;font-weight:700;padding:4px 8px;white-space:nowrap}
.dl24-chip-fail{background:#fff0f2;border-color:#f1ced6;color:#b33a4f}
.dl24-chip-review{background:#fff7e9;border-color:#f1dfb7;color:#a96c12}
.dl24-chip-critical{background:#ad2b42;border-color:#ad2b42;color:white}
.dl24-chip-muted{background:#edf1f6;color:#62748a}
.dl24-card-expanded{border-top:1px solid var(--p-line);background:#fff;padding:14px 16px 16px}
.dl24-expanded-heading{font-size:11px;font-weight:700;color:#2a4058;margin-bottom:9px}
.dl24-state-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dl24-state-list span{display:inline-flex;gap:4px;align-items:center;padding:4px 6px;font-size:9px;border-radius:7px;background:#f3f6fa;color:#60738a}
.dl24-state-list .dl24-state-good{background:#eaf8f1;color:#087653}.dl24-state-list .dl24-state-bad{background:#fff0f2;color:#ae344c}.dl24-state-list .dl24-state-review{background:#fff7e7;color:#9d6e1e}
.dl24-criterion{display:grid;grid-template-columns:minmax(0,1fr) auto 27px;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eff3f6}
.dl24-criterion>div:first-child,.dl24-criterion-count{display:flex;flex-direction:column;gap:3px;min-width:0}
.dl24-criterion strong{font-size:11px;color:#2b435c;font-weight:700}
.dl24-criterion small{color:#8495a7;font-size:10px;line-height:1.4}
.dl24-criterion-count{text-align:right}.dl24-criterion-count>strong{font-size:14px;color:#3c5269}
.dl24-criterion-go{display:grid;place-items:center;background:#f2f6fb;color:#416a94;width:26px;height:26px;border:1px solid #e1e9f2;border-radius:99px}
.dl24-coverage-note{border-top:1px solid #eff3f6;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:10px;color:#75889e;margin-top:4px}
.dl24-method{margin-top:12px;color:#6d8093;font-size:11px;background:#f1f5fb;border:1px solid #e3eaf3;border-radius:10px}
.dl24-method>summary{cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:7px;font-weight:700;color:#526e8a;list-style:none}
.dl24-method>summary::-webkit-details-marker{display:none}.dl24-method>summary>svg:last-child{margin-left:auto}
.dl24-method[open]>summary>svg:last-child{transform:rotate(180deg)}
.dl24-method>p{padding:0 12px 11px;margin:0;line-height:1.65}.dl24-method strong{color:#344f6c}
/* Tarjetas de navegación con arte, difuminado y acción consistente */
.dl24-access{min-height:163px;isolation:isolate;border-radius:17px;border:1px solid #cdddf2;box-shadow:0 2px 11px #233e590c}
.dl24-access .dl22-access-body{padding:18px 19px;max-width:none!important;position:static!important;width:100%;padding-right:43%}
.dl24-access .dl22-access-top{display:block;position:static!important}
.dl24-access .dl22-access-arrow{position:absolute!important;top:15px;right:16px!important;z-index:3;background:#fffffff0;box-shadow:0 2px 6px #19365616}
.dl24-access .dl22-access-ico{width:37px;height:37px;border-radius:12px}
.dl24-access h3{font-size:16px;font-weight:700;letter-spacing:-.02em;color:#223a57;margin:13px 0 4px}
.dl24-access p{font-size:11.4px;line-height:1.45;color:#6e8096;margin-bottom:8px}
.dl24-access .dl22-access-foot{font-size:10.8px;font-weight:700}
.dl24-access.dl22-access-map{background:radial-gradient(ellipse 200px 160px at 90% 70%,#d9e7fc 0%,transparent 83%),linear-gradient(111deg,#fff 12%,#edf5ff 100%)}
.dl24-access.dl22-access-diagnosis{background:radial-gradient(ellipse 210px 150px at 93% 60%,#f0d4f5 0%,transparent 84%),linear-gradient(111deg,#fff 12%,#faf1ff 100%);border-color:#e3d6f1}
.dl24-access.dl22-access-diagnosis .dl22-access-ico{background:#f2eaff;color:#8a55ab}
.dl24-access.dl22-access-diagnosis .dl22-access-foot{color:#8a4b9e}
.dl24-access .dl22-access-graph{width:39%;right:15px;top:29px;height:111px}
.dl24-diagnosis-art{position:absolute;width:39%;right:10px;top:23px;height:120px;pointer-events:none}
.dl24-access .dl22-access-arrow:hover{color:#1d5dc6;box-shadow:0 3px 9px #20467022}
@media(max-width:1240px){.dl24-pillar-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.dl24-evaluation .dl22-eval-header{padding:8px 1px 13px}.dl24-pillar-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.dl24-pillar>summary{padding:15px;min-height:235px}.dl24-card-measure{margin-top:17px}.dl24-primary-number{font-size:36px}.dl24-coverage{padding-left:10px}.dl24-card-footer{gap:5px}}
@media(max-width:650px){.dl24-pillar-grid{grid-template-columns:1fr;gap:11px}.dl24-pillar>summary{min-height:auto;padding:16px 17px 14px}.dl24-card-measure{margin-top:17px}.dl24-card-title strong{font-size:14px}.dl24-card-title small{font-size:11px}.dl24-primary-number{font-size:38px}.dl24-card-footer{margin-top:9px}.dl24-coverage{min-width:112px}.dl24-access .dl22-access-body{padding-right:42%}.dl24-access .dl22-access-graph,.dl24-diagnosis-art{width:40%}.dl24-evaluation .dl23-critical-overview{font-size:10px}}
@media(max-width:390px){.dl24-access .dl22-access-body{padding-right:39%}.dl24-access .dl22-access-graph,.dl24-diagnosis-art{width:36%;opacity:.83}.dl24-access p{font-size:10.8px}.dl24-primary-number{font-size:35px}}

/* DATA LENS v2.5 — consola: navegación persistente + jerarquía por espacio */
:root{--dl25-top-height:62px;--dl25-page:#f6f8fc;--dl25-hairline:#e2e8f0}
.app:not(.graph-focus){display:block!important;min-height:100dvh;background:var(--dl25-page)}
.app:not(.graph-focus) .main{width:100%;min-width:0}
.app:not(.graph-focus) .topbar.dl25-app-header{display:flex!important;position:sticky!important;top:0!important;left:0;right:0;height:var(--dl25-top-height)!important;min-height:var(--dl25-top-height)!important;padding:0 27px!important;justify-content:space-between!important;gap:22px!important;z-index:50;background:#fff!important;border-bottom:1px solid var(--dl25-hairline)!important;box-shadow:0 1px 5px #192c4307;backdrop-filter:none!important}
.dl25-header-left,.dl25-header-right{display:flex;align-items:center;gap:15px;min-width:0}
.dl25-header-left{flex:1;overflow:hidden}.dl25-header-right{flex:none}
.dl25-menu-button{width:34px;height:34px;min-width:34px;display:grid;place-items:center;border:0;border-radius:9px;background:transparent;color:#41556d;padding:7px}
.dl25-menu-button:hover,.dl25-menu-button[aria-expanded="true"]{background:#edf3fb;color:#235fb8}
.dl25-menu-button svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;fill:none}
.dl25-header-brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:3px 0;white-space:nowrap;cursor:pointer;color:#152b46}
.dl25-header-monogram{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#2556bd,#3575df);color:#fff;font-size:11px;font-weight:850;letter-spacing:-.08em;box-shadow:0 3px 8px #1b4cac26}
.dl25-header-brand-name{font-size:15px;font-weight:750;letter-spacing:-.025em}
.dl25-header-divider{height:25px;width:1px;background:#dbe3ed;flex:none;margin:0 2px}
.dl25-top-path{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;font-size:12.3px;color:#50647e;letter-spacing:-.01em}
.dl25-path-separator{font-size:21px;font-weight:300;color:#a1b0c2;line-height:1}
.dl25-path-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
button.dl25-path-item{border:0;padding:6px 0;background:transparent;color:#3969a6;font-weight:650;cursor:pointer}
button.dl25-path-item:hover{text-decoration:underline;text-underline-offset:3px}
.dl25-path-item.current{color:#263a52;font-weight:700}
.dl25-account-wrapper{position:relative}
.dl25-account-button{display:flex;align-items:center;gap:9px;border:1px solid #e1e8f2;background:#fff;border-radius:999px;padding:5px 9px 5px 5px;color:#536881;cursor:pointer;font-size:11.3px;font-weight:650}
.dl25-account-button:hover,.dl25-account-button[aria-expanded="true"]{background:#f6f9ff;border-color:#c4d4eb}
.dl25-account-avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:#e7efff;color:#2e62b3;font-size:11px;font-weight:800}
.dl25-account-chevron{font-size:17px;color:#7891af;line-height:1;margin-top:-3px}
.dl25-account-popover[hidden]{display:none!important}
.dl25-account-popover{position:absolute;right:0;top:calc(100% + 10px);width:246px;background:white;border:1px solid #dbe4f0;border-radius:13px;padding:16px;z-index:81;box-shadow:0 18px 45px #18365525;display:grid;gap:4px;color:#29405c}
.dl25-account-popover-title{font-size:13px;font-weight:760;margin-bottom:8px}
.dl25-account-popover>span{color:#7b8b9f;font-size:10px}.dl25-account-popover>strong{font-size:12px;font-weight:680;letter-spacing:.02em;margin-bottom:7px}
.dl25-account-popover>button{border:0;border-top:1px solid #edf1f6;background:transparent;padding:12px 0 0;margin-top:2px;text-align:left;display:flex;justify-content:space-between;color:#2561b0;font-size:11px;font-weight:700}
.app:not(.graph-focus) .sidebar{display:flex!important;position:fixed!important;left:0!important;top:var(--dl25-top-height)!important;height:calc(100dvh - var(--dl25-top-height))!important;width:268px!important;min-width:268px!important;padding:19px 14px 18px!important;transform:translateX(-105%)!important;visibility:hidden!important;overflow:auto!important;z-index:72!important;border-right:1px solid #e1e7ef;box-shadow:15px 15px 40px #1e395423!important;background:#fff!important;transition:transform .2s ease,visibility .2s ease}
.app.dl25-menu-open:not(.graph-focus) .sidebar{transform:translateX(0)!important;visibility:visible!important}
.dl25-close-menu{border:0;background:transparent;color:#8293a9;width:28px;height:28px;font-size:24px;font-weight:300;display:grid;place-items:center;margin-left:auto;border-radius:8px;cursor:pointer}
.dl25-close-menu:hover{background:#edf3fc;color:#254d83}
.dl25-menu-backdrop{display:none;position:fixed;inset:var(--dl25-top-height) 0 0;z-index:71;border:0;padding:0;background:rgba(12,29,51,.13);cursor:default}
.app.dl25-menu-open:not(.graph-focus) .dl25-menu-backdrop{display:block}
.app:not(.graph-focus) .g13-nav-fab,.app:not(.graph-focus) .g13-collapse-nav{display:none!important}
.app:not(.graph-focus) .content{max-width:1400px;margin:0 auto;padding:30px clamp(20px,3vw,48px) 90px!important}
.app:not(.graph-focus) .content>.breadcrumbs{display:none!important}
/* Layout of the approved overview — spacing, not nested panels */
.dl25-page-title{margin:0 0 31px!important}
.dl25-page-title h1{font-size:30px!important;letter-spacing:-.045em!important}
.dl25-page-title p{font-size:11.4px!important}
.dl24-evaluation .dl22-eval-header{padding:0 0 16px!important}
.dl24-evaluation{margin:0!important}
.dl24-evaluation .dl22-eval-header h2,.dl25-section-heading h2,.dl22-attention .dl22-section-head h2,.dl22-scope .dl22-section-head h2{font-size:17px!important;line-height:1.3;font-weight:740!important;letter-spacing:-.025em!important;margin:0 0 4px!important}
.dl24-evaluation .dl22-eval-header p,.dl25-section-heading p,.dl22-attention .dl22-section-head p,.dl22-scope .dl22-section-head p{font-size:11.6px!important;line-height:1.55!important;color:#7d8ba0!important;margin:0!important}
.dl25-access-section{margin:44px 0 0}
.dl25-section-heading{display:flex;align-items:flex-start;justify-content:space-between;margin:0 0 17px}
.dl25-section-heading h2{color:#1a2e48}
.dl25-access-section .dl22-access-grid{margin:0!important;gap:16px}
.dl25-access-section .dl24-access{min-height:167px}
.dl22-attention,.dl22-scope{background:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important;border-radius:0!important}
.dl22-attention{margin:45px 0 0!important}
.dl22-scope{margin:43px 0 0!important}
.dl22-attention .dl22-section-head,.dl22-scope .dl22-section-head{padding:0!important;margin-bottom:17px;display:flex;align-items:center}
.dl22-attention .table-wrap{margin:0!important;border:1px solid #dce5ef!important;border-radius:13px!important;overflow:auto;background:#fff;box-shadow:0 1px 5px #203d5b07}
.dl22-attention .dl22-attention-table th{background:#f5f8fc}
.dl22-attention .dl22-attention-table tr:last-child td{border-bottom:0}
.dl22-scope-grid{background:#fff;border:1px solid #dce5ef!important;border-radius:13px;overflow:hidden;box-shadow:0 1px 5px #203d5b07}
.dl22-scope-grid .dl22-scope-metric{padding-top:20px;padding-bottom:20px}
.dl24-method{margin-top:12px!important;border-radius:9px!important}
/* Keep the graph's existing full-screen view unchanged */
.app.graph-focus .dl25-app-header{display:none!important}
.app.graph-focus .dl25-menu-backdrop{display:none!important}
@media(max-width:820px){
  .app:not(.graph-focus) .topbar.dl25-app-header{height:56px!important;min-height:56px!important;padding:0 13px!important;gap:7px!important;position:sticky!important;justify-content:space-between!important}
  :root{--dl25-top-height:56px}
  .app:not(.graph-focus) .dl25-menu-button{display:grid!important;background:transparent!important;color:#41556d!important;border-radius:9px!important;width:32px!important;height:32px!important;padding:6px!important;font-size:inherit!important;letter-spacing:normal!important}
  .dl25-header-left{gap:9px}.dl25-header-monogram{width:29px;height:29px}.dl25-header-brand-name{display:none}.dl25-header-divider{margin:0}.dl25-account-button{padding:3px 4px}.dl25-account-label,.dl25-account-chevron{display:none}.dl25-account-avatar{width:29px;height:29px}
  .dl25-top-path{font-size:11px;gap:5px}.dl25-path-item{max-width:130px}
  .app:not(.graph-focus) .content{padding:21px 16px 65px!important}
  .dl25-page-title{margin-bottom:25px!important}
  .dl25-access-section{margin-top:32px}
  .dl22-attention,.dl22-scope{margin-top:35px!important}
  .dl25-section-heading{margin-bottom:12px}
  .dl22-attention .dl22-section-head,.dl22-scope .dl22-section-head{margin-bottom:12px}
}
@media(max-width:500px){
  .dl25-header-left{gap:7px}.dl25-header-brand{gap:0}.dl25-header-divider{height:20px}
  .dl25-path-item{max-width:94px}
  .dl24-evaluation .dl22-eval-header{align-items:flex-start!important}
  .dl22-attention .dl22-section-head,.dl22-scope .dl22-section-head{align-items:flex-start}
  .dl22-attention .dl22-section-head h2,.dl22-scope .dl22-section-head h2{font-size:15px!important}
  .dl22-attention .dl22-section-head>button,.dl22-scope .dl22-section-head>button{font-size:10px!important}
}


/* Data Lens v2.7 — estilo híbrido: contenedores rectos, controles suaves. */
#view.dl26-square-overview {
  --dl27-panel-radius: 4px;
  --dl27-line: #d5dee9;
  --dl27-shadow: 0 1px 2px rgba(25,46,70,.055);
  background:transparent;
}
/* Fondo casi blanco: contraste sobrio, sin teñir los módulos. */
html:has(#view.dl26-square-overview),
body:has(#view.dl26-square-overview),
#dl-app:has(#view.dl26-square-overview),
#dl-app:has(#view.dl26-square-overview) > .main {background:#fafbfd!important}

/* ÚNICAMENTE las superficies grandes delimitan secciones. */
#view.dl26-square-overview .dl24-pillar,
#view.dl26-square-overview .dl22-access.dl24-access,
#view.dl26-square-overview .dl22-attention .table-wrap,
#view.dl26-square-overview .dl22-scope-grid {
  border-radius:var(--dl27-panel-radius)!important;
  box-shadow:var(--dl27-shadow)!important;
}
#view.dl26-square-overview .dl24-pillar {
  transition:border-color .16s ease,box-shadow .16s ease!important;
}
#view.dl26-square-overview .dl24-pillar:hover {
  transform:none!important;
  box-shadow:0 2px 7px rgba(25,46,70,.105)!important;
}
#view.dl26-square-overview .dl24-pillar[open] {
  box-shadow:0 2px 7px rgba(25,46,70,.12)!important;
}
#view.dl26-square-overview .dl22-access.dl24-access:hover {
  box-shadow:0 2px 8px rgba(32,61,92,.10)!important;
}

/* v3.6.1 — asistente de escaneo con etapas conectadas y avance incremental */
#view.dl36-scan .scan-progress-toolbar.dl37-progress-toolbar {
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;
  gap:14px;padding:14px 17px 15px;margin-bottom:20px;background:#fff;
  border:1px solid #d0dbe7;border-radius:3px;box-shadow:none;
}
#view.dl36-scan .dl37-progress-main {min-width:0;}
#view.dl36-scan .dl37-progress-heading {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;margin:0 0 13px;padding:0 2px;color:#61748e;font-size:11px;font-weight:600;}
#view.dl36-scan .dl37-progress-heading strong {color:#24415f;font-size:11px;font-weight:750;}
#view.dl36-scan .stepper.dl37-stepper {
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:start;
  gap:0;margin:0;padding:0 0 2px;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;scrollbar-color:#cad5e5 transparent;
}
#view.dl36-scan .dl37-stepper .step {
  width:100%;min-width:0;position:relative;display:flex;flex-direction:column;gap:8px;
  align-items:center;justify-content:flex-start;padding:0 2px 5px;background:transparent!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;
  color:#718199;font-size:11px;font-weight:650;line-height:1.3;text-align:center;
}
#view.dl36-scan .dl37-stepper button.step {cursor:pointer;}
#view.dl36-scan .dl37-stepper button.step:hover {color:#0b65bc;}
#view.dl36-scan .dl37-stepper button.step:hover .step-num {border-color:#6597cf;box-shadow:0 0 0 4px #edf5ff;}
#view.dl36-scan .dl37-stepper .step:not(:first-child)::before {
  content:"";position:absolute;top:14px;left:-50%;width:100%;height:3px;
  background:#d8e0ea;z-index:0;pointer-events:none;
}
#view.dl36-scan .dl37-stepper .step.done::before,
#view.dl36-scan .dl37-stepper .step.active::before {background:#0972d3;}
#view.dl36-scan .dl37-stepper .step-num {
  width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;
  position:relative;z-index:1;background:#fff;border:2px solid #c6d0dd;
  border-radius:50%!important;box-shadow:0 0 0 3px #fff;color:#7a899d;
  font-size:11px;font-weight:800;transition:background .16s,border-color .16s;
}
#view.dl36-scan .dl37-stepper .step.done .step-num {
  background:#0972d3;border-color:#0972d3;color:#fff;
}
#view.dl36-scan .dl37-stepper .step.active .step-num {
  background:#e8f3ff;border-color:#0972d3;color:#0864c1;box-shadow:0 0 0 3px #fff,0 0 0 6px #dcecff;

#view.dl36-scan .dl37-stepper .step.active .dl37-step-label {color:#095cb0;font-weight:800;}
#view.dl36-scan .dl37-stepper .step.done .dl37-step-label {color:#355b88;font-weight:750;}
#view.dl36-scan .dl37-stepper .step.visited .step-num {border-color:#a4b7cc;}
#view.dl36-scan .dl37-stepper .step-disabled {opacity:1;}
#view.dl36-scan .scan-next-arrow {height:38px;width:40px;flex:0 0 40px;align-self:end;margin-bottom:4px;border-radius:4px;}

/* Data Lens v3.7 — Consolidación transversal, inspirada en Cloudscape.
   Regla: contenedores rectangulares, chips circulares, tabs subrayados, sin emojis.
   Se omite el Resumen aprobado y el grafo inmersivo de estos overrides. */
:root {
  --dlui-canvas: #fbfcfe;
  --dlui-surface: #ffffff;
  --dlui-border: #d7e0ea;
  --dlui-divider: #e4eaf1;
  --dlui-text: #1c3048;
  --dlui-muted: #62758a;
  --dlui-blue: #0972d3;
  --dlui-blue-hover: #eef5fd;
  --dlui-rectangle: 4px;
  --dlui-control: 5px;
  --dlui-pill: 999px;
  --dlui-focus-ring: 0 0 0 3px rgba(9, 114, 211, .18);
  /* Categoría (identidad) ≠ estado (resultado) */
  --dlui-type-s3: #bd7819;
  --dlui-type-redshift: #3768ca;
  --dlui-type-table: #087d91;
  --dlui-type-process: #8053c0;
  --dlui-type-security: #3168c8;
  --dlui-success: #0d7858;
  --dlui-danger: #b43649;
  --dlui-review: #96630f;
  --dlui-unmeasured: #62758b;
}
#view.dl37-integrated{color:var(--dlui-text);min-width:0;}
/* Los módulos ya usan paneles blancos rectangulares; se normaliza solamente el borde. */
#view.dl37-integrated [data-dl37-component="panel"]{
  border-color:var(--dlui-border)!important;
  border-radius:var(--dlui-rectangle)!important;
  box-shadow:none!important;
}
/* Las cabeceras y el contenido deben empezar en la misma columna visual. */
#view.dl37-integrated [data-dl37-component="table"]{max-width:100%;}
#view.dl37-integrated [data-dl37-component="table"] th,
#view.dl37-integrated [data-dl37-component="table"] td{
  text-indent:0!important;
  box-sizing:border-box;
  vertical-align:middle;
}
#view.dl37-integrated [data-dl37-component="table"] th:not(.right),
#view.dl37-integrated [data-dl37-component="table"] td:not(.right){text-align:left!important;}
#view.dl37-integrated [data-dl37-component="table"] th{background:#f4f6f9!important;color:#445972!important;letter-spacing:0!important;text-transform:none!important;font-weight:750!important;}
#view.dl37-integrated [data-dl37-component="table"] tbody tr:focus-within td{background:#f5f9ff;}
/* El mismo acabado AWS de pestañas en todas las fichas, sin pestañas píldora. */
#view.dl37-integrated [data-dl37-component="tabs"]{
  border-bottom-color:#b9c5d2!important;
  border-radius:0!important;
  background:transparent!important;
}
#view.dl37-integrated [data-dl37-component="tabs"] [role="tab"]{border-radius:0!important;}
#view.dl37-integrated [data-dl37-component="tabs"] [role="tab"].active{
  color:var(--dlui-blue)!important;
  border-bottom-color:var(--dlui-blue)!important;
}
/* Los estados no se confunden con la forma de los paneles. */
#view.dl37-integrated [data-dl37-component="chip"]{border-radius:var(--dlui-pill)!important;}
/* Foco accesible, consistente en toda la plataforma. */
#view.dl37-integrated :is(button,input,select,textarea,[role="link"],[role="tab"],[tabindex="0"]):focus-visible{
  outline:2px solid var(--dlui-blue)!important;
  outline-offset:2px;
}
#dl-app:not(.graph-focus) .dl25-app-header :is(button,[tabindex="0"]):focus-visible{
  outline:2px solid var(--dlui-blue)!important;outline-offset:2px;
}

  function dl28UpdateInventory(){

    filtered.sort((a,b)=>dl28.sort==='name'?a.dataset.dl28Name.localeCompare(b.dataset.dl28Name,'es'):Number(b.dataset.dl28Priority)-Number(a.dataset.dl28Priority)||a.dataset.dl28Name.localeCompare(b.dataset.dl28Name,'es'));
    const tbody=holder.querySelector('tbody');filtered.forEach(r=>tbody.append(r)); // matching rows get correct order, hidden rows stay hidden
    const pagesize=Number(holder.dataset.dl28Pagesize)||9;
    const pages=Math.max(1,Math.ceil(filtered.length/pagesize));dl28.page=Math.min(pages,Math.max(1,dl28.page));
    rows.forEach(r=>{r.hidden=true;r.style.display='none';});
    const visible=filtered.slice((dl28.page-1)*pagesize,dl28.page*pagesize);visible.forEach(r=>{r.hidden=false;r.style.display='';});
    const count=holder.querySelector('#dl28-count');if(count)count.textContent=`${filtered.length} de ${rows.length}`;
    const range=holder.querySelector('#dl28-range');if(range)range.textContent=filtered.length?`Mostrando ${(dl28.page-1)*pagesize+1}–${(dl28.page-1)*pagesize+visible.length} de ${filtered.length}`:'Sin coincidencias';
    const pageLabel=holder.querySelector('#dl28-page-label');if(pageLabel)pageLabel.textContent=`${dl28.page} / ${pages}`;
    holder.querySelector('[data-dl28-page="prev"]').disabled=dl28.page<=1;
    holder.querySelector('[data-dl28-page="next"]').disabled=dl28.page>=pages;
    holder.querySelector('.dl28-no-results').hidden=filtered.length!==0;
  }

      const state=i===ix?'active':i<ix?'done':i<=scanMaxStepReached?'visited':'step-disabled';

      const contents=`<span class="step-num" aria-hidden="true">${dot}</span><span class="dl37-step-label">${escapeHTML(label)}</span>`;
      return i===ix?`<span class="step ${state}" aria-current="step" aria-label="Etapa actual: ${escapeHTML(label)}">${contents}</span>`
        :i<ix||i<=scanMaxStepReached?`<button type="button" class="step ${state}" data-scan-step="${key}" aria-label="Ir a etapa ${i+1}: ${escapeHTML(label)}" title="Ir a ${escapeHTML(label)}">${contents}</button>`
        :`<span class="step ${state}" aria-disabled="true" aria-label="Etapa pendiente: ${escapeHTML(label)}">${contents}</span>`;
    }).join('')}</nav>`;

  function dl25CloseMenu(){document.getElementById('sidebar').classList.remove('open','g13-overlay-open');document.getElementById('dl-app').classList.remove('dl25-menu-open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');}

  function dl25CloseAccount(){const pop=document.getElementById('dl25-account-popover');pop.hidden=true;document.getElementById('dl25-account-button').setAttribute('aria-expanded','false');}
  document.getElementById('menu-toggle').addEventListener('click',()=>{dl25CloseAccount();dl25ToggleMenu();});
  document.getElementById('dl25-close-menu').addEventListener('click',dl25CloseMenu);
  document.getElementById('dl25-menu-backdrop').addEventListener('click',dl25CloseMenu);
  document.getElementById('dl25-account-button').addEventListener('click',()=>{dl25CloseMenu();const pop=document.getElementById('dl25-account-popover');pop.hidden=!pop.hidden;document.getElementById('dl25-account-button').setAttribute('aria-expanded',String(!pop.hidden));});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.dl25-account-wrapper'))dl25CloseAccount();});
  document.getElementById('g13-nav-fab').addEventListener('click',()=>{if(document.getElementById('dl-app').classList.contains('graph-focus'))document.getElementById('sidebar').classList.toggle('g13-overlay-open');else dl25ToggleMenu();});
  document.addEventListener('click',e=>{
    const choice=e.target.closest('[data-dl29-choice]');
    if(choice){const group=choice.dataset.dl29Choice;dl28[group]=choice.dataset.dl29Value;dl28.page=1;dl29UpdateFilter(group);dl29CloseFilters();dl28UpdateInventory();return;}
    const toggle=e.target.closest('[data-dl29-toggle]');
    if(toggle){const menu=toggle.closest('.dl29-filter').querySelector('.dl29-filter-menu');const willOpen=menu.hidden;dl29CloseFilters();menu.hidden=!willOpen;toggle.setAttribute('aria-expanded',String(willOpen));return;}
    if(!e.target.closest('.dl29-filter'))dl29CloseFilters();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')dl29CloseFilters();});
  document.addEventListener('input',e=>{if(e.target.id==='dl28-search'){dl28.query=e.target.value;dl28.page=1;dl28UpdateInventory();}});

  document.addEventListener('click',e=>{const pg=e.target.closest('[data-dl28-page]');if(pg){dl28.page+=pg.dataset.dl28Page==='next'?1:-1;dl28UpdateInventory();return;}const sort=e.target.closest('[data-dl28-sort]');if(sort){dl28.sort=sort.dataset.dl28Sort;dl28.page=1;dl28UpdateInventory();return;}});
  document.addEventListener('keydown',e=>{const tr=e.target.closest('.dl28-row');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();location.hash=tr.dataset.route;}});
  window.addEventListener('hashchange',()=>{state.search='';state.status='all';state.origin='all';state.tab='Resumen';dl33.tab='Resumen';dl28.query='';dl28.kind='all';dl28.result='all';dl28.page=1;render();window.scrollTo({top:0,behavior:'instant'});});
  if(!location.hash)location.hash='#/overview';else render();
})();
</script>
</body>
</html>
